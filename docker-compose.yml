# Este es el docker-compose.yml que utilizaremos en modo DESARROLLO.
# En este caso, usamos PHP:8.2-apache como una imagen preconfigurada para PHP.
# También utilizamos una base de datos MariaDB para almacenar los datos.
# Finalmente, usamos PHPMyAdmin para administrar la base de datos.
# El archivo de produccion sera docker-compose.prod.yml y no se utilizara phpmyadmin
#
# Zabbix (server, web, db y 3 agentes) forma parte del arranque normal
# del entorno de desarrollo. No se necesita ningún profile.
#
# Orquestación: cada servicio declara un `healthcheck:` y todas las
# dependencias usan `condition: service_healthy`. Esto elimina la race
# condition que provocaba un 502 transitorio en /zabbix/ cuando nginx
# arrancaba antes de que zabbix-web terminara su inicialización interna.

services:
  proxy:
    image: nginx:alpine
    container_name: songbird_proxy
    ports:
      - "${APP_PORT}:80"
    volumes:
      # configuracion del proxy
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:z
    networks:
      - songbird_network
    # proxy no arranca hasta que TODOS sus upstreams están healthy.
    # Esto garantiza que /zabbix/ y /phpmyadmin/ respondan al primer request.
    depends_on:
      web:
        condition: service_healthy
      phpmyadmin:
        condition: service_healthy
      zabbix-web:
        condition: service_healthy
    # Healthcheck del propio nginx (config cargada + respuesta HTTP local).
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --timeout=5 http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 7s
      retries: 6
      start_period: 15s

  web:
    build: .
    container_name: songbird_web
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./src:/var/www/html:z
      - uploads_data:/var/www/html/uploads:z
      
    networks:
      - songbird_network
    depends_on:
      db:
        condition: service_healthy
    # Healthcheck HTTP: `curl` viene incluido en php:8.2-apache.
    # Acepta 2xx/3xx/4xx, rechaza 5xx (Apache vivo pero respondiendo error de app).
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS -o /dev/null -w "%{http_code}" http://127.0.0.1/ | grep -qE '^[234][0-9][0-9]$'
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  db:
    image: mariadb:10.11
    container_name: songbird_db
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:Z
    networks:
      - songbird_network
    # Healthcheck MariaDB: `mariadb-admin ping` (la imagen incluye ambos aliases).
    # El doble `$$` escapa la variable para que la expanda el shell dentro del contenedor.
    healthcheck:
      test:
        - CMD-SHELL
        - mariadb-admin ping --protocol=tcp -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: songbird_pma
    environment:
      PMA_ABSOLUTE_URI: ${BASE_PATH}/phpmyadmin/
      PMA_HOST: ${PMA_HOST}
      PMA_USER: ${PMA_USER}
      PMA_PASSWORD: ${PMA_PASSWORD}
    networks:
      - songbird_network
    depends_on:
      db:
        condition: service_healthy
    # phpMyAdmin incluye curl (es Debian-based). Mismo patrón que `web`.
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS -o /dev/null -w "%{http_code}" http://127.0.0.1/ | grep -qE '^[234][0-9][0-9]$'
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # ==========================================
  # AGENTES ZABBIX
  # ==========================================
  zabbix-agent-proxy:
    image: ${ZABBIX_AGENT_IMAGE}
    container_name: zabbix-agent-proxy
    environment:
      - ZBX_SERVER_HOST=zabbix-server
      - ZBX_SERVER_PORT=${ZABBIX_SERVER_PORT}
      - ZBX_HOSTNAME=songbird_proxy
      - ZBX_PASSIVE_ALLOW=true
      - ZBX_ACTIVE_ALLOW=true
      - ZBX_METADATA=songbird proxy nginx
    networks:
      - songbird_network
    # El agente espera al server y al servicio que monitorea.
    depends_on:
      zabbix-server:
        condition: service_healthy
      proxy:
        condition: service_healthy
    # Healthcheck TCP al puerto del agente (10050). `nc` está en Alpine.
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 3 127.0.0.1 10050 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  zabbix-agent-web:
    image: ${ZABBIX_AGENT_IMAGE}
    container_name: zabbix-agent-web
    environment:
      - ZBX_SERVER_HOST=zabbix-server
      - ZBX_SERVER_PORT=${ZABBIX_SERVER_PORT}
      - ZBX_HOSTNAME=songbird_web
      - ZBX_PASSIVE_ALLOW=true
      - ZBX_ACTIVE_ALLOW=true
      - ZBX_METADATA=songbird web php-apache
    networks:
      - songbird_network
    depends_on:
      zabbix-server:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 3 127.0.0.1 10050 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  zabbix-agent-db:
    image: ${ZABBIX_AGENT_IMAGE}
    container_name: zabbix-agent-db
    environment:
      - ZBX_SERVER_HOST=zabbix-server
      - ZBX_SERVER_PORT=${ZABBIX_SERVER_PORT}
      - ZBX_HOSTNAME=songbird_db
      - ZBX_PASSIVE_ALLOW=true
      - ZBX_ACTIVE_ALLOW=true
      - ZBX_METADATA=songbird db mariadb
    networks:
      - songbird_network
    depends_on:
      zabbix-server:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 3 127.0.0.1 10050 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  zabbix-agent-server:
    image: ${ZABBIX_AGENT_IMAGE}
    container_name: zabbix-agent-server
    environment:
      - ZBX_SERVER_HOST=zabbix-server
      - ZBX_SERVER_PORT=${ZABBIX_SERVER_PORT}
      # Este nombre debe coincidir exactamente con el que Zabbix trae por defecto
      - ZBX_HOSTNAME=Zabbix server 
      - ZBX_PASSIVE_ALLOW=true
      - ZBX_ACTIVE_ALLOW=true
    networks:
      - songbird_network
    depends_on:
      zabbix-server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 3 127.0.0.1 10050 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  # ==========================================
  # INFRAESTRUCTURA DE MONITOREO (ZABBIX)
  # ==========================================
  zabbix-db:
    image: ${ZABBIX_DB_IMAGE}
    container_name: zabbix-db-dev
    command: --log_bin_trust_function_creators=1
    environment:
      - TZ=${ZABBIX_TZ}
      - MYSQL_DATABASE=${ZABBIX_DB_NAME}
      - MYSQL_USER=${ZABBIX_DB_USER}
      - MYSQL_PASSWORD=${ZABBIX_DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${ZABBIX_DB_ROOT_PASSWORD}
    volumes:
      - zabbix-db-data:/var/lib/mysql
    networks:
      - songbird_network
    # Healthcheck MySQL 8.0.41: `mysqladmin ping` (incluido en la imagen).
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --protocol=tcp -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s

  zabbix-server:
    image: ${ZABBIX_SERVER_IMAGE}
    container_name: zabbix-server-dev
    environment:
      - TZ=${ZABBIX_TZ}
      - DB_SERVER_HOST=zabbix-db
      - MYSQL_DATABASE=${ZABBIX_DB_NAME}
      - MYSQL_USER=${ZABBIX_DB_USER}
      - MYSQL_PASSWORD=${ZABBIX_DB_PASSWORD}
      - ZBX_LISTENPORT=${ZABBIX_SERVER_PORT}
    networks:
      - songbird_network
    depends_on:
      zabbix-db:
        condition: service_healthy
    # Healthcheck TCP al puerto 10051. start_period generoso porque
    # la inicialización del esquema puede tardar 30-60 s en el primer arranque.
    healthcheck:
      test:
        - CMD-SHELL
        - nc -z -w 3 127.0.0.1 "$${ZBX_LISTENPORT:-10051}" || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  zabbix-web:
    image: ${ZABBIX_WEB_IMAGE}
    container_name: zabbix-web-dev
    environment:
      - TZ=${ZABBIX_TZ}
      - DB_SERVER_HOST=zabbix-db
      - MYSQL_DATABASE=${ZABBIX_DB_NAME}
      - MYSQL_USER=${ZABBIX_DB_USER}
      - MYSQL_PASSWORD=${ZABBIX_DB_PASSWORD}
      - ZBX_SERVER_HOST=zabbix-server
      - ZBX_SERVER_PORT=${ZABBIX_SERVER_PORT}
      - PHP_TZ=${ZABBIX_TZ}
      # URL pública del frontend. CRÍTICO cuando Zabbix vive detrás de
      # un reverse proxy en sub-path: si Zabbix no conoce su URL pública
      # completa, emite redirects relativos que el navegador resuelve en
      # bucles infinitos al cruzar auth/login.
      - ZBX_BASE_URL=${ZABBIX_BASE_URL}
    networks:
      - songbird_network
    # zabbix-web espera a la BD y al server (ambos healthy) antes de arrancar.
    depends_on:
      zabbix-server:
        condition: service_healthy
      zabbix-db:
        condition: service_healthy
    # Healthcheck HTTP al puerto interno 8080. wget está disponible en Alpine.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --timeout=5 http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 7s
      retries: 12
      start_period: 60s

volumes:
  mariadb_data:
  zabbix-db-data:
  uploads_data:

networks:
  songbird_network:
    driver: bridge