# =============================================================================
# SONGBIRD — Stack completo (DESARROLLO y PRODUCCIÓN)
# =============================================================================
# Este es el ÚNICO compose file del proyecto: el mismo archivo levanta el
# entorno de desarrollo y el de producción. Lo que cambia entre ambos es el
# contenido del `.env` (APP_ENVIRONMENT, credenciales, APP_PORT), que el
# módulo `deploy` del operador genera para producción.
#
# BASE DE DATOS: estrategia MASTER-SLAVE
#   db-master            → escritura. Alias de red `db` (compatibilidad).
#   db-slave             → lectura. Réplica con GTID, solo lectura.
#   db-replication-init  → one-shot: crea el usuario de replicación y
#                          ejecuta CHANGE MASTER TO + START SLAVE.
#
# El healthcheck del slave exige `Slave_running=ON`: "healthy" significa
# "replicando de verdad", no solo "el proceso vive".
#
# CONFIGURACIÓN DECLARATIVA
#   Los parámetros de cada nodo MariaDB están declarados en el `command:` del
#   servicio, con el "por qué" de cada setting en los comentarios.
#   La única lógica (el CHANGE MASTER TO) vive en un único script:
#     database/replication/init-replication.sh
#
# ORQUESTACIÓN
#   Cada servicio declara un `healthcheck:` y las dependencias usan
#   `condition: service_healthy`. Esto elimina las race conditions que
#   provocaban un 502 transitorio en /zabbix/ y en la app.
#
# IMPORTANTE (entrypoint de MariaDB)
#   El entrypoint hace `set -- mariadbd "$@"` SOLO si el primer argumento
#   empieza con "-". Por eso `command:` NO debe incluir el literal `mariadbd`:
#   `command: [mariadbd, --server-id=1]` ejecutaría `mariadbd mariadbd ...`.
# =============================================================================

services:
  proxy:
    image: nginx:alpine
    container_name: songbird_proxy
    restart: unless-stopped
    ports:
      - "${APP_PORT}:80"
    volumes:
      # configuracion del proxy
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:z
    networks:
      - songbird_network
    # proxy no arranca hasta que TODOS sus upstreams están healthy.
    # Esto garantiza que /zabbix/ responda al primer request.
    depends_on:
      web:
        condition: service_healthy
      zabbix-web:
        condition: service_healthy
    # Healthcheck del propio nginx (config cargada + respuesta HTTP local).
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --timeout=5 http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 7s
      retries: 6
      start_period: 15s

  web:
    build: .
    container_name: songbird_web
    restart: unless-stopped
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      # --- Estrategia master-slave ---
      # DB_HOST      = maestro (escritura)
      # DB_SLAVE_HOST = esclavo (lectura)
      DB_HOST: ${DB_HOST:-db-master}
      DB_SLAVE_HOST: ${DB_SLAVE_HOST:-db-slave}
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASS: ${MYSQL_PASSWORD}
      DB_PORT: ${DB_PORT:-3306}
      # Enruta SELECT al slave e INSERT/UPDATE/DELETE al master.
      DB_READ_REPLICA_ENABLED: ${DB_READ_REPLICA_ENABLED:-true}
      # Tras una escritura, espera a que el slave la aplique ("leer lo que
      # escribí"). Sin esto, una lectura posterior en otro request podría ir
      # al slave y todavía no ver la fila recién insertada.
      DB_REPLICA_WAIT_AFTER_WRITE: ${DB_REPLICA_WAIT_AFTER_WRITE:-true}
      DB_REPLICA_WAIT_TIMEOUT_MS: ${DB_REPLICA_WAIT_TIMEOUT_MS:-2000}
      # Variables heredadas (compatibilidad con el código existente).
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ./src:/var/www/html:z
    networks:
      - songbird_network
    # La app depende SOLO del master: si el slave cae, la app sigue
    # escribiendo (fail-open al master) en vez de quedarse sin base de datos.
    depends_on:
      db-master:
        condition: service_healthy
    # Healthcheck HTTP: `curl` viene incluido en php:8.2-apache.
    # Acepta 2xx/3xx/4xx, rechaza 5xx (Apache vivo pero respondiendo error de app).
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS -o /dev/null -w "%{http_code}" http://127.0.0.1/ | grep -qE '^[234][0-9][0-9]$'
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ==========================================================================
  # BASE DE DATOS: MASTER (escritura)
  # ==========================================================================
  db-master:
    image: mariadb:10.11
    container_name: songbird_db_master
    restart: unless-stopped
    # Configuración del nodo maestro.
    # NO incluir el literal `mariadbd` (ver nota del entrypoint arriba).
    command:
      # Identidad del nodo: debe ser única dentro del cluster (1=master, 2=slave).
      - --server-id=1
      # Binary log: es exactamente lo que el slave replica.
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      # GTID: habilita el auto-posicionado del slave (MASTER_USE_GTID=slave_pos),
      # así el slave retoma solo lo que se perdió mientras estuvo caído.
      - --gtid-strict-mode=ON
      - --gtid-domain-id=0
      # Registra en su propio binlog lo que replica. Necesario para que el
      # slave lleve el registro de los GTID que aplicó (gtid_binlog_pos).
      - --log-slave-updates=ON
      # DURABILIDAD: con el default (sync_binlog=0) una caída del host puede
      # perder transacciones YA confirmadas que el slave nunca recibió, y
      # master y slave divergen. Con 1, el binlog se fsync antes del ack.
      - --sync-binlog=1
      # Retención del binlog: 7 días. El slave lo necesita para reconectar.
      - --binlog-expire-logs-seconds=604800
      # Evita el DNS inverso en cada conexión.
      - --skip-name-resolve=ON
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mariadb_master_data:/var/lib/mysql
      # Schema inicial: solo en el master. El slave lo recibe por replicación.
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:Z
    networks:
      songbird_network:
        aliases:
          # Alias `db` por compatibilidad: phpMyAdmin (PMA_HOST) y cualquier
          # configuración legacy siguen apuntando al master.
          - db
          - db-master
    # Healthcheck MariaDB: `mariadb-admin ping` + binlog habilitado.
    # El doble `$$` escapa la variable para que la expanda el shell del contenedor.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mariadb-admin ping --protocol=tcp -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent
          && mariadb --protocol=tcp -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" -N -B
          -e 'SELECT @@log_bin' | grep -qx 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ==========================================================================
  # BASE DE DATOS: SLAVE (lectura / respaldo en caliente)
  # ==========================================================================
  db-slave:
    image: mariadb:10.11
    container_name: songbird_db_slave
    restart: unless-stopped
    # Configuración del nodo esclavo.
    command:
      # Identidad del nodo (distinta del master).
      - --server-id=2
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --gtid-strict-mode=ON
      - --gtid-domain-id=0
      - --log-slave-updates=ON
      # Solo lectura: bloquea INSERT/UPDATE/DELETE a los usuarios SIN
      # privilegio SUPER (el usuario de la app no lo tiene).
      - --read-only=ON
      # Relay log: donde el slave aplica lo que recibe del master.
      - --relay-log=relay-bin
      # Recupera el relay log si quedó corrupto tras una caída. Sin esto el
      # slave puede no volver a arrancar.
      - --relay-log-recovery=ON
      # Aplica los eventos en paralelo.
      - --slave-parallel-workers=4
      - --skip-name-resolve=ON
    environment:
      # OJO: no se pasa MYSQL_DATABASE/USER/PASSWORD. El entrypoint del slave
      # crearía localmente los objetos que luego llegan por replicación
      # (CREATE DATABASE / CREATE USER) y la replicación se rompería.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_REPLICATION_USER: ${MYSQL_REPLICATION_USER:-repl}
      MYSQL_REPLICATION_PASSWORD: ${MYSQL_REPLICATION_PASSWORD}
    volumes:
      - mariadb_slave_data:/var/lib/mysql
    networks:
      songbird_network:
        aliases:
          - db-slave
    depends_on:
      db-master:
        condition: service_healthy
    # Healthcheck ESTRICTO: además del ping exige que los hilos de
    # replicación (IO y SQL) estén corriendo. `Slave_running` es ON solo
    # cuando ambos hilos funcionan.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mariadb-admin ping --protocol=tcp -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent
          && mariadb --protocol=tcp -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" -N -B
          -e 'SHOW GLOBAL STATUS LIKE "Slave_running"' | grep -q ON
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ==========================================================================
  # INICIALIZADOR DE REPLICACIÓN (one-shot)
  # ==========================================================================
  # Crea el usuario de replicación en el master y configura el slave con
  # CHANGE MASTER TO (auto-posicionado por GTID) + START SLAVE.
  # Es idempotente: si la replicación ya está activa, sale con 0.
  db-replication-init:
    # Reusa la imagen de MariaDB: ya trae el cliente `mariadb` que necesita
    # el script, así que no hace falta ningún build ni descarga extra.
    image: mariadb:10.11
    container_name: songbird_db_replication_init
    restart: "no"
    # Se sobrescribe el entrypoint de la imagen (que arrancaría un servidor)
    # para ejecutar el script una vez y morir.
    entrypoint: ["/bin/bash", "/opt/init-replication.sh"]
    volumes:
      - ./database/replication/init-replication.sh:/opt/init-replication.sh:Z
    environment:
      MASTER_HOST: db-master
      SLAVE_HOST: db-slave
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_REPLICATION_USER: ${MYSQL_REPLICATION_USER:-repl}
      MYSQL_REPLICATION_PASSWORD: ${MYSQL_REPLICATION_PASSWORD}
      REPL_WAIT_TIMEOUT: 120
    networks:
      - songbird_network
    depends_on:
      db-master:
        condition: service_healthy
      # `service_started` (no healthy): el healthcheck del slave exige que la
      # replicación esté activa, y eso es justamente lo que hace este
      # contenedor. Con `service_healthy` habría un deadlock.
      db-slave:
        condition: service_started

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: songbird_pma
    restart: unless-stopped
    environment:
      PMA_ABSOLUTE_URI: ${BASE_PATH}/phpmyadmin/
      PMA_HOST: ${PMA_HOST:-db-master}
      PMA_USER: ${PMA_USER:-${MYSQL_USER}}
      PMA_PASSWORD: ${PMA_PASSWORD:-${MYSQL_PASSWORD}}
    networks:
      - songbird_network
    depends_on:
      db-master:
        condition: service_healthy
    # phpMyAdmin incluye curl (es Debian-based). Mismo patrón que `web`.
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS -o /dev/null -w "%{http_code}" http://127.0.0.1/ | grep -qE '^[234][0-9][0-9]$'
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # ==========================================================================
  # AGENTES ZABBIX (sidecar por servicio)
  # ==========================================================================
  zabbix-agent-proxy:
    image: ${ZABBIX_AGENT_IMAGE}
    container_name: songbird_zabbix_agent_proxy
    restart: unless-stopped
    environment:
      - ZBX_SERVER_HOST=zabbix-server
      - ZBX_SERVER_PORT=${ZABBIX_SERVER_PORT}
      - ZBX_HOSTNAME=songbird_proxy
      - ZBX_PASSIVE_ALLOW=true
      - ZBX_ACTIVE_ALLOW=true
      - ZBX_METADATA=songbird proxy nginx
    networks:
      - songbird_network
    # El agente espera al server y al servicio que monitorea.
    depends_on:
      zabbix-server:
        condition: service_healthy
      proxy:
        condition: service_healthy
    # Healthcheck TCP al puerto del agente (10050). `nc` está en Alpine.
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 3 127.0.0.1 10050 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  zabbix-agent-web:
    image: ${ZABBIX_AGENT_IMAGE}
    container_name: songbird_zabbix_agent_web
    restart: unless-stopped
    environment:
      - ZBX_SERVER_HOST=zabbix-server
      - ZBX_SERVER_PORT=${ZABBIX_SERVER_PORT}
      - ZBX_HOSTNAME=songbird_web
      - ZBX_PASSIVE_ALLOW=true
      - ZBX_ACTIVE_ALLOW=true
      - ZBX_METADATA=songbird web php-apache
    networks:
      - songbird_network
    depends_on:
      zabbix-server:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 3 127.0.0.1 10050 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  zabbix-agent-db:
    image: ${ZABBIX_AGENT_IMAGE}
    container_name: songbird_zabbix_agent_db
    restart: unless-stopped
    environment:
      - ZBX_SERVER_HOST=zabbix-server
      - ZBX_SERVER_PORT=${ZABBIX_SERVER_PORT}
      - ZBX_HOSTNAME=songbird_db
      - ZBX_PASSIVE_ALLOW=true
      - ZBX_ACTIVE_ALLOW=true
      - ZBX_METADATA=songbird db mariadb master
    networks:
      - songbird_network
    depends_on:
      zabbix-server:
        condition: service_healthy
      db-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 3 127.0.0.1 10050 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  # Agente del ESCLAVO: permite alertar por lag de replicación.
  zabbix-agent-db-slave:
    image: ${ZABBIX_AGENT_IMAGE}
    container_name: songbird_zabbix_agent_db_slave
    restart: unless-stopped
    environment:
      - ZBX_SERVER_HOST=zabbix-server
      - ZBX_SERVER_PORT=${ZABBIX_SERVER_PORT}
      - ZBX_HOSTNAME=songbird_db_slave
      - ZBX_PASSIVE_ALLOW=true
      - ZBX_ACTIVE_ALLOW=true
      - ZBX_METADATA=songbird db mariadb slave replica
    networks:
      - songbird_network
    depends_on:
      zabbix-server:
        condition: service_healthy
      db-slave:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 3 127.0.0.1 10050 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  zabbix-agent-server:
    image: ${ZABBIX_AGENT_IMAGE}
    container_name: songbird_zabbix_agent_server
    restart: unless-stopped
    environment:
      - ZBX_SERVER_HOST=zabbix-server
      - ZBX_SERVER_PORT=${ZABBIX_SERVER_PORT}
      # Este nombre debe coincidir exactamente con el que Zabbix trae por defecto
      - ZBX_HOSTNAME=Zabbix server
      - ZBX_PASSIVE_ALLOW=true
      - ZBX_ACTIVE_ALLOW=true
    networks:
      - songbird_network
    depends_on:
      zabbix-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 3 127.0.0.1 10050 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  # ==========================================================================
  # INFRAESTRUCTURA DE MONITOREO (Zabbix)
  # ==========================================================================
  zabbix-db:
    image: ${ZABBIX_DB_IMAGE}
    container_name: songbird_zabbix_db
    restart: unless-stopped
    command: --log_bin_trust_function_creators=1
    environment:
      - TZ=${ZABBIX_TZ}
      - MYSQL_DATABASE=${ZABBIX_DB_NAME}
      - MYSQL_USER=${ZABBIX_DB_USER}
      - MYSQL_PASSWORD=${ZABBIX_DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${ZABBIX_DB_ROOT_PASSWORD}
    volumes:
      - zabbix-db-data:/var/lib/mysql
    networks:
      - songbird_network
    # Healthcheck MySQL 8.0.41: `mysqladmin ping` (incluido en la imagen).
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --protocol=tcp -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s

  zabbix-server:
    image: ${ZABBIX_SERVER_IMAGE}
    container_name: songbird_zabbix_server
    restart: unless-stopped
    environment:
      - TZ=${ZABBIX_TZ}
      - DB_SERVER_HOST=zabbix-db
      - MYSQL_DATABASE=${ZABBIX_DB_NAME}
      - MYSQL_USER=${ZABBIX_DB_USER}
      - MYSQL_PASSWORD=${ZABBIX_DB_PASSWORD}
      - ZBX_LISTENPORT=${ZABBIX_SERVER_PORT}
    networks:
      - songbird_network
    depends_on:
      zabbix-db:
        condition: service_healthy
    # Healthcheck TCP al puerto 10051. start_period generoso porque
    # la inicialización del esquema puede tardar 30-60 s en el primer arranque.
    healthcheck:
      test:
        - CMD-SHELL
        - nc -z -w 3 127.0.0.1 "$${ZBX_LISTENPORT:-10051}" || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  zabbix-web:
    image: ${ZABBIX_WEB_IMAGE}
    container_name: songbird_zabbix_web
    restart: unless-stopped
    environment:
      - TZ=${ZABBIX_TZ}
      - DB_SERVER_HOST=zabbix-db
      - MYSQL_DATABASE=${ZABBIX_DB_NAME}
      - MYSQL_USER=${ZABBIX_DB_USER}
      - MYSQL_PASSWORD=${ZABBIX_DB_PASSWORD}
      - ZBX_SERVER_HOST=zabbix-server
      - ZBX_SERVER_PORT=${ZABBIX_SERVER_PORT}
      - PHP_TZ=${ZABBIX_TZ}
      # URL pública del frontend de Zabbix. CRÍTICO cuando Zabbix vive detrás de
      # un reverse proxy en sub-path: si Zabbix no conoce su URL pública
      # completa, emite redirects relativos que el navegador resuelve en
      # bucles infinitos al cruzar auth/login.
      - ZBX_BASE_URL=${ZABBIX_BASE_URL}
    networks:
      - songbird_network
    # zabbix-web espera a la BD y al server (ambos healthy) antes de arrancar.
    depends_on:
      zabbix-server:
        condition: service_healthy
      zabbix-db:
        condition: service_healthy
    # Healthcheck HTTP al puerto interno 8080. wget está disponible en Alpine.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --timeout=5 http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 7s
      retries: 12
      start_period: 60s

volumes:
  mariadb_master_data:
  mariadb_slave_data:
  zabbix-db-data:

networks:
  songbird_network:
    driver: bridge
