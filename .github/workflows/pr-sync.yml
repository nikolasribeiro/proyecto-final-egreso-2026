name: Automatización de PRs
on:
  pull_request:
    types: [opened, edited, synchronize]

jobs:
  auto-configurar:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Sincronizar datos del Issue al PR (incluye Project v2)
        uses: actions/github-script@v7
        with:
          script: |
            const { main } = require('./.github/scripts/sync-pr.js');
            await main({ github, context, core });
