server {
    listen 80;
    server_name localhost; # En desarrollo usamos localhost

    # Resolver dinámico para que nginx NO valide los upstreams al arranque.
    # Evita que el proxy muera si zabbix-web aún no está listo o si se
    # removió el profile monitoring. La IP `127.0.0.11` corresponde al
    # DNS interno de Docker; en Podman es la IP del nameserver del
    # bridge (visible en /etc/resolv.conf dentro del contenedor, ej.
    # `nameserver 10.89.3.1`). Ajustar según el entorno.
    #
    # Para máxima portabilidad, se usa el search domain dns.podman /
    # docker explícito abajo (compatible con ambos motores).
    resolver 127.0.0.11 10.89.3.1 ipv6=off valid=30s;

    location / {
        # 'web' es el nombre del servicio de Apache en el docker-compose
        proxy_pass http://web:80;

        # Le pasamos la IP real del visitante a Apache por si tu código PHP la necesita
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /phpmyadmin/ {
        # 'phpmyadmin' es el nombre del servicio de phpmyadmin en el docker-compose
        proxy_pass http://phpmyadmin:80/;

        # Le pasamos la IP real del visitante a Apache por si tu código PHP la necesita
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ==========================================
    # Zabbix dashboard (proxy hacia zabbix-web)
    # ==========================================
    # Zabbix no usa URLs relativas: emite paths absolutos a /zabbix.php,
    # /chart.php, /assets/..., etc. Capturamos tanto la subruta
    # /zabbix/ como los endpoints comunes para no perder assets.
    #
    # Usamos `set $zabbix_web` + `proxy_pass $zabbix_web` para que nginx
    # resuelva el upstream dinámicamente vía el resolver declarado arriba
    # en lugar de al arranque. Si el servicio no está, nginx devuelve 502
    # en lugar de crashear.

    location /zabbix/ {
        # Usa proxy_pass con URL literal (no variable) para que nginx
        # preserve el Content-Type del upstream (no lo cambia a text/html).
        # El `resolver` declarado arriba permite que nginx resuelva
        # `zabbix-web` dinámicamente vía DNS (127.0.0.11 Docker /
        # 10.89.3.1 Podman) y no muera al arranque si el upstream no
        # está disponible.
        proxy_pass http://zabbix-web:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Informa a Zabbix el prefijo público. Combinado con ZBX_BASE_URL
        # en docker-compose, Zabbix genera URLs absolutas correctas en
        # lugar de redirects relativos que el navegador resuelve en bucles.
        proxy_set_header X-Forwarded-Prefix /zabbix;

        # CRÍTICO: Zabbix emite cookies con Path=/ pero nginx, dentro de
        # location /zabbix/, las reescribía a Path=/zabbix. Eso hacía que
        # el navegador no reenviara la cookie en requests a /zabbix/*.php
        # → Zabbix veía "no autenticado" tras login y redirigía al login
        # otra vez → bucle infinito de redirecciones.
        # Forzamos que las cookies de Zabbix siempre tengan Path=/.
        proxy_cookie_path / /;

        # Reescribe los headers Location/Refresh que Zabbix emite con su
        # URL interna (http://zabbix-web:8080/...) para que apunten al
        # path público (/zabbix/...). `proxy_redirect default` reescribe
        # tanto absolutos como los que vienen solo con path.
        proxy_redirect default;

        # Buffers grandes: Zabbix sirve respuestas pesadas (Chart.js, listas).
        proxy_buffer_size          128k;
        proxy_buffers              4 256k;
        proxy_busy_buffers_size    256k;

        # Reescritura de assets de Zabbix para sub-path /zabbix/.
        # Zabbix emite paths tanto relativos como absolutos. Para que
        # todos funcionen detrás del proxy hacemos:
        #   1) Inyectamos <base href="/zabbix/"> en el <head> para que
        #      los paths RELATIVOS del HTML (<link href="assets/...">)
        #      resuelvan a /zabbix/assets/...
        #   2) Reescribimos paths absolutos `="/...` por `="/zabbix/...`
        #      para los casos donde Zabbix emite href="/assets/...".
        #
        # NOTA: NO usamos sub_filter_types para no alterar el Content-Type
        # de los responses (preservamos text/css, application/javascript,
        # etc.). Esto significa que `url(/assets/...)` DENTRO de archivos
        # CSS externos NO se reescribe automáticamente. Para esos casos
        # hay que añadir el prefijo manualmente (ver hookup en Zabbix UI:
        # Administration → General → "Frontend URL" = /zabbix).
        sub_filter '<head>' '<head><base href="/zabbix/">';
        sub_filter '="/' '="/zabbix/';
        sub_filter_once off;
    }

    # Endpoints y assets que Zabbix referencia con paths absolutos
    # (no vía /zabbix/ prefix). Sin esto, el navegador pierde CSS/JS.
    # Importante: el regex usa `^/(?!zabbix/)` para NO capturar paths que
    # ya están bajo /zabbix/ (el negative lookahead evita que el regex le
    # robe el tráfico al prefix location /zabbix/). También excluimos
    # /js, /css, /img, /assets para no romper rutas del proyecto PHP
    # principal (que usa /assets/css/main.css, /assets/js/dashboard.js).
    location ~ ^/(?!zabbix/)(zabbix|zabbix-api|zabbix-chart|zabbix-triggers|zabbix-screens|zabbix-maps|zabbix-report|zabbix-availability|zabbix-history|zabbix-latest|data|fonts|zabbix\.php|zabbix_chart\.php|zabbix_screens\.php|zabbix_maps\.php|zabbix_report\.php|zabbix_availability\.php|zabbix_history\.php|zabbix_latest\.php|api_jsonrpc\.php) {
        # Mismo razonamiento que en /zabbix/: URL literal + resolver para
        # preservar Content-Type y permitir resolución DNS dinámica.
        proxy_pass http://zabbix-web:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /zabbix;
        proxy_cookie_path / /;
        # Mismo reescritura de Location que en /zabbix/ para coherencia.
        proxy_redirect default;
    }
}
