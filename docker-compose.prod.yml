services:
  # ==========================================
  # APLICACIÓN PRINCIPAL (PRODUCCIÓN)
  # ==========================================
  proxy:
    image: nginx:alpine
    container_name: songbird_proxy
    ports:
      - "${APP_PORT}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:z
    networks:
      - songbird_network
    depends_on:
      - web
    restart: unless-stopped

  web:
    build: .
    container_name: songbird_web
    volumes:
      - ./src:/var/www/html:z
    networks:
      - songbird_network
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mariadb:10.11
    container_name: songbird_db
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - songbird_network
    restart: unless-stopped

  # ==========================================
  # INFRAESTRUCTURA DE MONITOREO (ZABBIX)
  # ==========================================
  zabbix-db:
    image: mysql:8.0-oracle
    container_name: zabbix-db-prod
    command: --log_bin_trust_function_creators=1
    environment:
      - MYSQL_DATABASE=zabbix
      - MYSQL_USER=zabbix
      - MYSQL_PASSWORD=zabbix_password
      - MYSQL_ROOT_PASSWORD=root_password
    volumes:
      - zabbix-db-data:/var/lib/mysql
    networks:
      - songbird_network
    restart: unless-stopped

  zabbix-server:
    image: zabbix/zabbix-server-mysql:alpine-7.0-latest
    container_name: zabbix-server-prod
    environment:
      - DB_SERVER_HOST=zabbix-db
      - MYSQL_DATABASE=zabbix
      - MYSQL_USER=zabbix
      - MYSQL_PASSWORD=zabbix_password
    ports:
      - "10051:10051"
    networks:
      - songbird_network
    depends_on:
      - zabbix-db
    restart: unless-stopped

  zabbix-web:
    image: zabbix/zabbix-web-nginx-mysql:alpine-7.0-latest
    container_name: zabbix-web-prod
    environment:
      - DB_SERVER_HOST=zabbix-db
      - MYSQL_DATABASE=zabbix
      - MYSQL_USER=zabbix
      - MYSQL_PASSWORD=zabbix_password
      - ZBX_SERVER_HOST=zabbix-server
      - PHP_TZ=America/Montevideo
    ports:
      - "8080:8080"
    networks:
      - songbird_network
    depends_on:
      - zabbix-server
    restart: unless-stopped

volumes:
  mariadb_data:
  zabbix-db-data:

networks:
  songbird_network:
    driver: bridge