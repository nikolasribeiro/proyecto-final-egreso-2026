services:
  # ==========================================
  # APLICACIÓN PRINCIPAL (PRODUCCIÓN)
  # ==========================================
  proxy:
    image: nginx:alpine
    container_name: songbird_proxy
    ports:
      - "${APP_PORT}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:z
    networks:
      - songbird_network
    # proxy no arranca hasta que sus upstreams publicados estén healthy.
    # En producción phpmyadmin NO existe, así que solo se esperan `web` y `zabbix-web`.
    depends_on:
      web:
        condition: service_healthy
      zabbix-web:
        condition: service_healthy
    restart: unless-stopped
    # Healthcheck HTTP local del propio nginx (config cargada + respuesta).
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --timeout=5 http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 7s
      retries: 6
      start_period: 15s

  web:
    build: .
    container_name: songbird_web
    volumes:
      - ./src:/var/www/html:z
    networks:
      - songbird_network
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # Healthcheck HTTP: `curl` viene incluido en php:8.2-apache.
    # Acepta 2xx/3xx/4xx, rechaza 5xx (Apache vivo pero respondiendo error de app).
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS -o /dev/null -w "%{http_code}" http://127.0.0.1/ | grep -qE '^[234][0-9][0-9]$'
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  db:
    image: mariadb:10.11
    container_name: songbird_db
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - songbird_network
    restart: unless-stopped
    # Healthcheck MariaDB. `$$VAR` se expande dentro del contenedor.
    healthcheck:
      test:
        - CMD-SHELL
        - mariadb-admin ping --protocol=tcp -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ==========================================
  # AGENTES ZABBIX (sidecar por servicio)
  # ==========================================
  zabbix-agent-proxy:
    image: ${ZABBIX_AGENT_IMAGE}
    container_name: zabbix-agent-proxy
    environment:
      - ZBX_SERVER_HOST=zabbix-server
      - ZBX_SERVER_PORT=${ZABBIX_SERVER_PORT}
      - ZBX_HOSTNAME=songbird_proxy
      - ZBX_PASSIVE_ALLOW=true
      - ZBX_ACTIVE_ALLOW=true
      - ZBX_METADATA=songbird proxy nginx
    networks:
      - songbird_network
    # En prod el agente también espera al servicio que monitorea.
    depends_on:
      zabbix-server:
        condition: service_healthy
      proxy:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 3 127.0.0.1 10050 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  zabbix-agent-web:
    image: ${ZABBIX_AGENT_IMAGE}
    container_name: zabbix-agent-web
    environment:
      - ZBX_SERVER_HOST=zabbix-server
      - ZBX_SERVER_PORT=${ZABBIX_SERVER_PORT}
      - ZBX_HOSTNAME=songbird_web
      - ZBX_PASSIVE_ALLOW=true
      - ZBX_ACTIVE_ALLOW=true
      - ZBX_METADATA=songbird web php-apache
    networks:
      - songbird_network
    depends_on:
      zabbix-server:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 3 127.0.0.1 10050 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  zabbix-agent-db:
    image: ${ZABBIX_AGENT_IMAGE}
    container_name: zabbix-agent-db
    environment:
      - ZBX_SERVER_HOST=zabbix-server
      - ZBX_SERVER_PORT=${ZABBIX_SERVER_PORT}
      - ZBX_HOSTNAME=songbird_db
      - ZBX_PASSIVE_ALLOW=true
      - ZBX_ACTIVE_ALLOW=true
      - ZBX_METADATA=songbird db mariadb
    networks:
      - songbird_network
    depends_on:
      zabbix-server:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 3 127.0.0.1 10050 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s

  # ==========================================
  # INFRAESTRUCTURA DE MONITOREO (ZABBIX)
  # ==========================================
  zabbix-db:
    image: ${ZABBIX_DB_IMAGE}
    container_name: zabbix-db-prod
    command: --log_bin_trust_function_creators=1
    environment:
      - TZ=${ZABBIX_TZ}
      - MYSQL_DATABASE=${ZABBIX_DB_NAME}
      - MYSQL_USER=${ZABBIX_DB_USER}
      - MYSQL_PASSWORD=${ZABBIX_DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${ZABBIX_DB_ROOT_PASSWORD}
    volumes:
      - zabbix-db-data:/var/lib/mysql
    networks:
      - songbird_network
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --protocol=tcp -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s

  zabbix-server:
    image: ${ZABBIX_SERVER_IMAGE}
    container_name: zabbix-server-prod
    environment:
      - TZ=${ZABBIX_TZ}
      - DB_SERVER_HOST=zabbix-db
      - MYSQL_DATABASE=${ZABBIX_DB_NAME}
      - MYSQL_USER=${ZABBIX_DB_USER}
      - MYSQL_PASSWORD=${ZABBIX_DB_PASSWORD}
      - ZBX_LISTENPORT=${ZABBIX_SERVER_PORT}
    # Puerto NO expuesto al host: los agentes sidecar y nginx lo alcanzan
    # por la red interna songbird_network (DNS automático de Docker).
    networks:
      - songbird_network
    depends_on:
      zabbix-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - nc -z -w 3 127.0.0.1 "$${ZBX_LISTENPORT:-10051}" || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  zabbix-web:
    image: ${ZABBIX_WEB_IMAGE}
    container_name: zabbix-web-prod
    environment:
      - TZ=${ZABBIX_TZ}
      - DB_SERVER_HOST=zabbix-db
      - MYSQL_DATABASE=${ZABBIX_DB_NAME}
      - MYSQL_USER=${ZABBIX_DB_USER}
      - MYSQL_PASSWORD=${ZABBIX_DB_PASSWORD}
      - ZBX_SERVER_HOST=zabbix-server
      - ZBX_SERVER_PORT=${ZABBIX_SERVER_PORT}
      - PHP_TZ=${ZABBIX_TZ}
      # URL pública del frontend. CRÍTICO cuando Zabbix vive detrás de
      # un reverse proxy en sub-path: si Zabbix no conoce su URL pública
      # completa, emite redirects relativos que el navegador resuelve en
      # bucles infinitos al cruzar auth/login.
      - ZBX_BASE_URL=${ZABBIX_BASE_URL}
    # Puerto NO expuesto al host: el dashboard se accede vía nginx en
    # http://localhost:${APP_PORT}/zabbix/ (definido en nginx/default.conf).
    networks:
      - songbird_network
    # Restaurado: en prod también esperamos a `zabbix-db` (antes faltaba).
    depends_on:
      zabbix-server:
        condition: service_healthy
      zabbix-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider --timeout=5 http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 7s
      retries: 12
      start_period: 60s

volumes:
  mariadb_data:
  zabbix-db-data:

networks:
  songbird_network:
    driver: bridge